# nginx in front of the target, configured as the README recommends
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
}

http {
    access_log off;

    upstream target {
        server target:8080;
        # reused connections, where a desync between nginx and the target would mix up requests
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://target;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
