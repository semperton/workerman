worker_processes 2;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    # wrk keeps connections open, the default of 1000 would reconnect often
    keepalive_requests 100000;

    server {
        listen 8080 reuseport backlog=1024;

        location / {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /bench/server/index.php;
            # no upstream keepalive, an idle cached connection would block an fpm child
            fastcgi_pass unix:/run/php/fpm.sock;
        }
    }
}
